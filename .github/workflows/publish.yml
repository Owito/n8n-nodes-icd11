name: Publish to npm

# Requisito de n8n desde el 1 de mayo de 2026: los nodos enviados a verificación
# deben publicarse desde GitHub Actions con declaración de procedencia (provenance).
# n8n ya no acepta paquetes verificados publicados desde una máquina local.
#
# Autenticación por trusted publishing (OIDC), sin token de larga vida: npm
# confía en este repositorio y en este workflow, y emite una credencial efímera
# en cada ejecución. Requiere que el paquete tenga configurado el Trusted
# Publisher en npmjs.com (organización Owito, repositorio n8n-nodes-icd11,
# workflow publish.yml).
#
# Con OIDC npm genera y publica la provenance por su cuenta, así que ya no se
# pasa --provenance ni se define NODE_AUTH_TOKEN.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necesario para el OIDC de trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Node 24 trae npm 11.x; trusted publishing exige npm >= 11.5.1
          # y Node >= 22.14.0.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # npm desaconseja cachear en builds de publicación.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
