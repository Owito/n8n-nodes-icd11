name: Publish to npm

# n8n requirement since 1 May 2026: nodes submitted for verification must be
# published from GitHub Actions with a provenance attestation. n8n no longer
# accepts verified packages published from a local machine.
#
# Authentication is npm trusted publishing (OIDC), with no long-lived token:
# npm trusts this repository and this workflow, and issues an ephemeral
# credential per run. It requires the package to have a Trusted Publisher
# configured on npmjs.com (owner Owito, repository n8n-nodes-icd11, workflow
# publish.yml).
#
# Under OIDC npm generates and publishes the provenance itself, so neither
# --provenance nor NODE_AUTH_TOKEN is passed here.
#
# Actions are pinned to a full commit SHA rather than a tag. Tags are mutable:
# whoever can move one would run arbitrary code in a job that holds
# `id-token: write`, which is the credential that publishes this package.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the trusted publishing OIDC exchange

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Node 24 ships npm 11.x; trusted publishing requires npm >= 11.5.1
          # and Node >= 22.14.0.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # npm advises against caching on publish builds.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
