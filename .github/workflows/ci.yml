name: CI

# Lint, build and structural validation on every push and pull request.
#
# The validation step loads the compiled node description and checks the demo
# workflow against it, so it needs no WHO API credentials and no network. See
# test/README.md.

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Development toolchain only. `n8n-workflow` pulls in `isolated-vm`, a
        # native module that does not build against the V8 shipped with Node
        # 20, so the dev install needs Node >= 22.
        #
        # The published package is unaffected: it has zero runtime dependencies
        # and is plain JavaScript loaded by n8n, so `engines: >=20.19` in
        # package.json remains the correct requirement for consumers.
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate demo workflow against the compiled node
        run: npm test
